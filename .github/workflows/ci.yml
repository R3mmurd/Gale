name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.9" (the floor
        # pymunk, gale.physics's backend, itself requires). 3.14 isn't
        # here yet despite pymunk already publishing cp314 wheels:
        # plain pygame doesn't have cp314 wheels of its own yet (only
        # its pygame-ce fork does, a different PyPI package gale
        # doesn't depend on), so `pip install gale-engine` still can't
        # complete on 3.14 today — add it back once pygame catches up.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Check code style (black)
        run: black --check --diff .

      - name: Run tests
        run: pytest --cov=gale --cov-report=term-missing
