name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.7"; 3.7 itself
        # is left out here since actions/setup-python no longer has a
        # prebuilt binary for it on current runners, but every version
        # actually likely to be used today is covered.
        python-version:
          ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Check code style (black)
        run: black --check --diff .

      - name: Run tests
        run: pytest --cov=gale --cov-report=term-missing
